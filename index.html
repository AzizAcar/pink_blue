<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karanlık Neon Yıldız ve Ay Çarpışması</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020205;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Merkezdeki beyaz başlangıç düğmesi */
        .white-trigger-btn {
            background: #ffffff;
            color: #020205;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.35), 0 0 60px rgba(255, 255, 255, 0.15);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), 
                        box-shadow 0.35s ease, 
                        opacity 0.4s ease;
        }

        .white-trigger-btn:hover {
            transform: scale(1.07);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.65), 0 0 80px rgba(255, 255, 255, 0.25);
        }

        .white-trigger-btn:active {
            transform: scale(0.96);
        }

        .hidden-btn {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.85);
        }

        /* Tekrar oynat düğmesi */
        .replay-btn {
            background: rgba(10, 12, 22, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(190, 20, 110, 0.4);
            color: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 18px rgba(160, 10, 90, 0.25), inset 0 0 12px rgba(0, 60, 180, 0.2);
            transition: all 0.35s ease;
        }

        .replay-btn:hover {
            background: rgba(20, 24, 42, 0.9);
            color: #ffffff;
            border-color: rgba(0, 95, 230, 0.7);
            box-shadow: 0 0 24px rgba(0, 95, 230, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="relative flex items-center justify-center">

    <!-- Ana Animasyon Kanvası -->
    <canvas id="sceneCanvas"></canvas>

    <!-- Merkezdeki Beyaz Düğme -->
    <div id="startContainer" class="absolute inset-0 flex items-center justify-center z-10 pointer-events-none">
        <button id="startBtn" 
                aria-label="Animasyonu Başlat"
                class="white-trigger-btn pointer-events-auto px-10 py-4 rounded-full font-semibold text-base sm:text-lg tracking-wider uppercase cursor-pointer">
            Başlat
        </button>
    </div>

    <!-- Çarpışma Sonrası Tekrar Oynat Düğmesi -->
    <div id="replayContainer" class="absolute bottom-10 inset-x-0 flex justify-center z-10 opacity-0 pointer-events-none transition-opacity duration-700">
        <button id="replayBtn" 
                class="replay-btn px-6 py-2.5 rounded-full text-sm font-medium tracking-wide flex items-center gap-2 cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
            Tekrar İzle
        </button>
    </div>

    <script>
        /**
         * Karanlık Neon Yıldız (Derin Crimson-Magenta) ve Ay (Derin Elektrik Kobalt Mavisi)
         * Çarpışma & 500 Parçacıklı Toz Dağılımı Simülasyonu
         */
        const canvas = document.getElementById('sceneCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const startContainer = document.getElementById('startContainer');
        const replayBtn = document.getElementById('replayBtn');
        const replayContainer = document.getElementById('replayContainer');

        let width = window.innerWidth;
        let height = window.innerHeight;
        let dpr = Math.min(window.devicePixelRatio || 1, 2);

        // Karanlık ama Parlak Neon Renk Paleti
        const COLORS = {
            bg: '#020205',
            // Karanlık Neon Pembe (Crimson-Magenta)
            darkNeonPinkCore: '#e60073',
            darkNeonPinkFill: '#8a0045',
            darkNeonPinkEdge: '#ff1a8c',
            darkNeonPinkGlow: 'rgba(210, 0, 105, 0.85)',
            darkPinkDust: ['#99004d', '#c20061', '#e60073', '#6b0036', '#ff1a8c'],

            // Karanlık Neon Mavi (Elektrik Kobalt / Gece Mavisi)
            darkNeonBlueCore: '#0066ff',
            darkNeonBlueFill: '#002b80',
            darkNeonBlueEdge: '#1a8cff',
            darkNeonBlueGlow: 'rgba(0, 85, 230, 0.85)',
            darkBlueDust: ['#003594', '#004ecc', '#0066ff', '#002266', '#1a8cff']
        };

        const STATE = {
            IDLE: 'IDLE',
            APPROACHING: 'APPROACHING',
            SHATTERED: 'SHATTERED'
        };

        let currentState = STATE.IDLE;
        let animStartTime = 0;
        const APPROACH_DURATION = 2400;

        let bgStars = [];
        let dustParticles = [];
        let shockwaves = [];
        let flashAlpha = 0;
        let shakeIntensity = 0;

        const starObj = {
            x: 0,
            y: 0,
            startX: 0,
            radius: 42,
            rotation: 0,
            trail: []
        };

        const moonObj = {
            x: 0,
            y: 0,
            startX: 0,
            radius: 42,
            rotation: -0.25,
            trail: []
        };

        /**
         * Arka plandaki çok hafif uzay noktalarını oluşturur
         */
        function initBackgroundStars() {
            bgStars = [];
            const count = Math.floor((width * height) / 16000);
            for (let i = 0; i < count; i++) {
                bgStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.3 + 0.3,
                    alpha: Math.random() * 0.28 + 0.04,
                    twinkleSpeed: Math.random() * 0.003 + 0.001,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        /**
         * Yıldız ve Ay'ın başlangıç konumlarını ayarlar
         */
        function resetPositions() {
            const margin = Math.max(starObj.radius * 2.2, width * 0.14);
            starObj.startX = margin;
            moonObj.startX = width - margin;

            starObj.x = starObj.startX;
            starObj.y = height / 2;
            starObj.rotation = 0;
            starObj.trail = [];

            moonObj.x = moonObj.startX;
            moonObj.y = height / 2;
            moonObj.rotation = -0.2;
            moonObj.trail = [];
        }

        /**
         * Kanvas boyutlarını pencereye göre uyarlar
         */
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            dpr = Math.min(window.devicePixelRatio || 1, 2);

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const baseRadius = Math.max(28, Math.min(48, Math.min(width, height) * 0.075));
            starObj.radius = baseRadius;
            moonObj.radius = baseRadius;

            initBackgroundStars();

            if (currentState === STATE.IDLE) {
                resetPositions();
            }
        }

        /**
         * Yavaştan başlayıp aniden hızlanan eğri
         */
        function slowThenSuddenBurstEase(t) {
            return Math.pow(t, 4.2);
        }

        /**
         * Karanlık Neon 5 Köşeli Yıldız Çizimi
         */
        function drawStar(ctx, x, y, radius, rotation, stretchX = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(stretchX, 1 / Math.sqrt(stretchX));
            ctx.rotate(rotation);

            // Çok katmanlı karanlık neon pembe parlama
            ctx.shadowColor = COLORS.darkNeonPinkGlow;
            ctx.shadowBlur = 32;

            ctx.beginPath();
            const spikes = 5;
            const outerRadius = radius;
            const innerRadius = radius * 0.44;

            for (let i = 0; i < spikes * 2; i++) {
                const r = i % 2 === 0 ? outerRadius : innerRadius;
                const angle = (i * Math.PI) / spikes - Math.PI / 2;
                const px = Math.cos(angle) * r;
                const py = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();

            const grad = ctx.createRadialGradient(0, 0, radius * 0.08, 0, 0, outerRadius);
            grad.addColorStop(0, COLORS.darkNeonPinkCore);
            grad.addColorStop(0.65, COLORS.darkNeonPinkFill);
            grad.addColorStop(1, '#4d0026');

            ctx.fillStyle = grad;
            ctx.fill();

            // Parlak neon kenar çizgisi
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = COLORS.darkNeonPinkEdge;
            ctx.stroke();

            ctx.restore();
        }

        /**
         * Karanlık Neon Hilal Ay Çizimi
         */
        function drawCrescentMoon(ctx, x, y, radius, rotation, stretchX = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(stretchX, 1 / Math.sqrt(stretchX));
            ctx.rotate(rotation);

            // Çok katmanlı karanlık neon mavi parlama
            ctx.shadowColor = COLORS.darkNeonBlueGlow;
            ctx.shadowBlur = 34;

            ctx.beginPath();
            ctx.arc(0, 0, radius, 0.25 * Math.PI, 1.75 * Math.PI, false);
            ctx.arc(radius * 0.42, 0, radius * 0.82, 1.62 * Math.PI, 0.38 * Math.PI, true);
            ctx.closePath();

            const grad = ctx.createRadialGradient(-radius * 0.25, 0, radius * 0.08, 0, 0, radius);
            grad.addColorStop(0, COLORS.darkNeonBlueCore);
            grad.addColorStop(0.65, COLORS.darkNeonBlueFill);
            grad.addColorStop(1, '#001640');

            ctx.fillStyle = grad;
            ctx.fill();

            // Parlak neon kenar çizgisi
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = COLORS.darkNeonBlueEdge;
            ctx.stroke();

            ctx.restore();
        }

        /**
         * Çarpışma anında her iki sembolü 500 adet karanlık neon toz taneciğine dönüştürür
         */
        function triggerShatterIntoDust(impactX, impactY) {
            currentState = STATE.SHATTERED;
            shakeIntensity = 15;
            flashAlpha = 0.55;
            dustParticles = [];
            shockwaves = [];

            // Çarpışma anı karanlık neon şok dalgaları
            shockwaves.push({
                x: impactX,
                y: impactY,
                radius: 6,
                maxRadius: Math.min(width, height) * 0.44,
                alpha: 0.85,
                color: '#e60073',
                lineWidth: 3.5
            });
            shockwaves.push({
                x: impactX,
                y: impactY,
                radius: 3,
                maxRadius: Math.min(width, height) * 0.34,
                alpha: 0.9,
                color: '#0066ff',
                lineWidth: 2.5
            });

            // Toplam 500 parçacık (250 karanlık neon pembe + 250 karanlık neon mavi)
            const totalParticles = 500;

            for (let i = 0; i < totalParticles; i++) {
                const isPink = i < totalParticles / 2;
                const palette = isPink ? COLORS.darkPinkDust : COLORS.darkBlueDust;
                const color = palette[Math.floor(Math.random() * palette.length)];

                const spreadAngle = Math.random() * Math.PI * 2;
                const spreadDist = Math.random() * (starObj.radius * 0.72);
                const startX = impactX + Math.cos(spreadAngle) * spreadDist + (isPink ? -8 : 8);
                const startY = impactY + Math.sin(spreadAngle) * spreadDist;

                const burstAngle = Math.random() * Math.PI * 2;
                const isFineMist = Math.random() > 0.35;
                const speed = isFineMist 
                    ? (Math.random() * 5.8 + 0.45) 
                    : (Math.random() * 13.5 + 3.5);

                dustParticles.push({
                    x: startX,
                    y: startY,
                    vx: Math.cos(burstAngle) * speed,
                    vy: Math.sin(burstAngle) * speed,
                    size: isFineMist ? (Math.random() * 2.0 + 0.7) : (Math.random() * 3.1 + 1.2),
                    color: color,
                    glowColor: isPink ? 'rgba(230, 0, 115, 0.7)' : 'rgba(0, 102, 255, 0.7)',
                    alpha: Math.random() * 0.35 + 0.65,
                    drag: isFineMist ? (0.955 + Math.random() * 0.025) : (0.93 + Math.random() * 0.03),
                    gravity: (Math.random() - 0.48) * 0.015,
                    turbulencePhase: Math.random() * Math.PI * 2,
                    turbulenceSpeed: Math.random() * 0.03 + 0.01,
                    decay: Math.random() * 0.0032 + 0.0018
                });
            }

            setTimeout(() => {
                if (currentState === STATE.SHATTERED) {
                    replayContainer.classList.remove('opacity-0', 'pointer-events-none');
                    replayContainer.classList.add('opacity-100', 'pointer-events-auto');
                }
            }, 2200);
        }

        /**
         * Animasyonu başlatır
         */
        function startSequence() {
            startBtn.classList.add('hidden-btn');
            startContainer.classList.add('pointer-events-none');

            replayContainer.classList.remove('opacity-100', 'pointer-events-auto');
            replayContainer.classList.add('opacity-0', 'pointer-events-none');

            dustParticles = [];
            shockwaves = [];
            flashAlpha = 0;
            resetPositions();

            currentState = STATE.APPROACHING;
            animStartTime = performance.now();
        }

        /**
         * Ana Render Döngüsü (60 FPS)
         */
        function render(now) {
            requestAnimationFrame(render);

            ctx.fillStyle = COLORS.bg;
            ctx.fillRect(0, 0, width, height);

            ctx.save();

            // Çarpışma anı ekran sarsıntısı
            if (shakeIntensity > 0.1) {
                const dx = (Math.random() - 0.5) * shakeIntensity;
                const dy = (Math.random() - 0.5) * shakeIntensity;
                ctx.translate(dx, dy);
                shakeIntensity *= 0.86;
            }

            // Arka plan uzay noktaları
            for (let i = 0; i < bgStars.length; i++) {
                const s = bgStars[i];
                const twinkle = Math.sin(now * s.twinkleSpeed + s.phase) * 0.1;
                ctx.fillStyle = `rgba(200, 215, 255, ${Math.max(0.02, s.alpha + twinkle)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }

            // DURUM 1: YAKLAŞMA
            if (currentState === STATE.APPROACHING) {
                const elapsed = now - animStartTime;
                const rawProgress = Math.min(elapsed / APPROACH_DURATION, 1);
                const eased = slowThenSuddenBurstEase(rawProgress);

                const centerX = width / 2;
                const collisionOffset = starObj.radius * 0.45;

                const targetStarX = centerX - collisionOffset;
                const targetMoonX = centerX + collisionOffset;

                const prevStarX = starObj.x;

                starObj.x = starObj.startX + (targetStarX - starObj.startX) * eased;
                moonObj.x = moonObj.startX + (targetMoonX - moonObj.startX) * eased;

                const velocity = Math.abs(starObj.x - prevStarX);
                const stretch = 1 + Math.min(velocity * 0.012, 0.48);

                starObj.rotation += 0.012 + velocity * 0.0045;
                moonObj.rotation -= 0.008 + velocity * 0.0035;

                if (velocity > 1.5) {
                    starObj.trail.push({ x: starObj.x, y: starObj.y, rot: starObj.rotation, alpha: 0.42 });
                    moonObj.trail.push({ x: moonObj.x, y: moonObj.y, rot: moonObj.rotation, alpha: 0.42 });
                }

                // Karanlık neon hareket izleri
                for (let i = starObj.trail.length - 1; i >= 0; i--) {
                    const t = starObj.trail[i];
                    t.alpha -= 0.045;
                    if (t.alpha <= 0) {
                        starObj.trail.splice(i, 1);
                        continue;
                    }
                    ctx.save();
                    ctx.globalAlpha = t.alpha * 0.5;
                    drawStar(ctx, t.x, t.y, starObj.radius * 0.92, t.rot, 1);
                    ctx.restore();
                }

                for (let i = moonObj.trail.length - 1; i >= 0; i--) {
                    const t = moonObj.trail[i];
                    t.alpha -= 0.045;
                    if (t.alpha <= 0) {
                        moonObj.trail.splice(i, 1);
                        continue;
                    }
                    ctx.save();
                    ctx.globalAlpha = t.alpha * 0.5;
                    drawCrescentMoon(ctx, t.x, t.y, moonObj.radius * 0.92, t.rot, 1);
                    ctx.restore();
                }

                const fadeIn = Math.min(elapsed / 350, 1);
                ctx.save();
                ctx.globalAlpha = fadeIn;
                drawStar(ctx, starObj.x, starObj.y, starObj.radius, starObj.rotation, stretch);
                drawCrescentMoon(ctx, moonObj.x, moonObj.y, moonObj.radius, moonObj.rotation, stretch);
                ctx.restore();

                if (rawProgress >= 1) {
                    triggerShatterIntoDust(centerX, height / 2);
                }
            }

            // DURUM 2: ÇARPIŞMA VE KARANLIK NEON TOZ DAĞILIMI
            if (currentState === STATE.SHATTERED) {
                // Çarpışma anı karanlık neon enerji parlaması
                if (flashAlpha > 0.01) {
                    const flashGrad = ctx.createRadialGradient(
                        width / 2, height / 2, 5,
                        width / 2, height / 2, Math.min(width, height) * 0.35
                    );
                    flashGrad.addColorStop(0, `rgba(210, 0, 110, ${flashAlpha * 0.65})`);
                    flashGrad.addColorStop(0.5, `rgba(0, 75, 220, ${flashAlpha * 0.45})`);
                    flashGrad.addColorStop(1, 'rgba(2, 2, 5, 0)');
                    ctx.fillStyle = flashGrad;
                    ctx.fillRect(0, 0, width, height);
                    flashAlpha *= 0.88;
                }

                // Şok dalgaları
                for (let i = shockwaves.length - 1; i >= 0; i--) {
                    const sw = shockwaves[i];
                    sw.radius += (sw.maxRadius - sw.radius) * 0.11;
                    sw.alpha *= 0.91;

                    if (sw.alpha < 0.01) {
                        shockwaves.splice(i, 1);
                        continue;
                    }

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = sw.color;
                    ctx.shadowColor = sw.color;
                    ctx.shadowBlur = 16;
                    ctx.globalAlpha = sw.alpha;
                    ctx.lineWidth = sw.lineWidth;
                    ctx.stroke();
                    ctx.restore();
                }

                // 500 Parçacıklı Neon Toz Bulutu (hafif ve yüksek performanslı çizim)
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';

                for (let i = dustParticles.length - 1; i >= 0; i--) {
                    const p = dustParticles[i];

                    p.vx *= p.drag;
                    p.vy *= p.drag;
                    p.vy += p.gravity;

                    p.turbulencePhase += p.turbulenceSpeed;
                    p.x += p.vx + Math.cos(p.turbulencePhase) * 0.22;
                    p.y += p.vy + Math.sin(p.turbulencePhase) * 0.22;

                    p.alpha -= p.decay;

                    if (p.alpha <= 0) {
                        dustParticles.splice(i, 1);
                        continue;
                    }

                    // Dış neon hale (shadowBlur yerine hızlı çift katmanlı daire)
                    ctx.globalAlpha = Math.max(0, p.alpha * 0.35);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * 2.3, 0, Math.PI * 2);
                    ctx.fill();

                    // Parlak iç çekirdek
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            ctx.restore();
        }

        // Olay Dinleyicileri
        window.addEventListener('resize', resizeCanvas);
        startBtn.addEventListener('click', startSequence);
        replayBtn.addEventListener('click', startSequence);

        // Başlangıç kurulumu
        resizeCanvas();
        requestAnimationFrame(render);
    </script>
</body>
</html>
